---
# Configure Splunk Heavy Forwarder

- name: Accept Splunk license and set admin password (first time setup)
  shell: |
    su {{ splunk_user }} -s /bin/bash -c "{{ splunk_home }}/bin/splunk start --accept-license --answer-yes --no-prompt --seed-passwd {{ splunk_admin_password }}"
  args:
    creates: "{{ splunk_home }}/etc/system/local/user-seed.conf"
  become: yes
  register: splunk_hf_first_start

- name: Stop Splunk for configuration
  shell: |
    su {{ splunk_user }} -s /bin/bash -c "{{ splunk_home }}/bin/splunk stop"
  become: yes
  when: splunk_hf_first_start.changed

- name: Configure Splunk web port
  template:
    src: web.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/web.conf"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0644'

- name: Configure Splunk outputs (forward to indexer)
  template:
    src: outputs.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/outputs.conf"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0644'

- name: Configure Splunk inputs (receive from Universal Forwarders)
  template:
    src: inputs.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/inputs.conf"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0644'

- name: Configure Splunk server settings
  template:
    src: server.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/server.conf"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0644'

- name: Enable Splunk to start at boot
  command: "{{ splunk_home }}/bin/splunk enable boot-start -user {{ splunk_user }} --accept-license --answer-yes --no-prompt"
  args:
    creates: /etc/init.d/splunk
  when: splunk_enable_boot_start | bool

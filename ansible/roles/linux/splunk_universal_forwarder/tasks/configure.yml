---
# Configure Splunk Universal Forwarder (Linux)

- name: Create user-seed.conf to set admin password
  copy:
    dest: "{{ splunk_forwarder_home }}/etc/system/local/user-seed.conf"
    content: |
      [user_info]
      USERNAME = admin
      PASSWORD = {{ splunk_admin_password }}
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0600'
  become: yes

- name: Configure Splunk outputs (forward to Heavy Forwarder)
  template:
    src: outputs.conf.j2
    dest: "{{ splunk_forwarder_home }}/etc/system/local/outputs.conf"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0644'

- name: Configure Splunk inputs (log file monitoring)
  template:
    src: inputs.conf.j2
    dest: "{{ splunk_forwarder_home }}/etc/system/local/inputs.conf"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0644'

- name: Enable Splunk Universal Forwarder to start at boot
  shell: |
    {{ splunk_forwarder_home }}/bin/splunk enable boot-start -user {{ splunk_user }} --accept-license --answer-yes --no-prompt -systemd-managed 1
  args:
    creates: /etc/systemd/system/SplunkForwarder.service
  become: yes
  when: splunk_enable_boot_start | bool
